<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul li:first-child{
            color: pink;
        }
        ul li:last-child{
            color: skyblue;
        }
        ul li:nth-child(3){
            color: red;
        }
        ul li:nth-child(4){
            color:green;
        }
        ul li:nth-child(even){
            color:aqua;
        }
        ul li:nth-child(odd){
            color:maroon;
        }
        ul li:nth-last-child(2){
            color:black;
        }
         ul li:nth-last-child(even){
            color:pink;
        }
         ul li:nth-last-child(odd){
            color:blue;
        }


    </style>
</head>
<body>
   <ul>
    <li>jeevan</li>
    <li>jagadish</li>
    <li>sabyasachi</li>
    <li>mounika</li>
    <li>priya</li>
    <li>mehreen</li>
    <li>anusha</li>
   </ul>
</body>
</html>
