<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input:enabled{
            background-color: maroon;
        }
         input:disabled{
            background-color:aqua;
        }
        input:checked{
            outline: solid 2px red;
        }

    </style>
</head>
<body>
    <input type="text">
    <input type="text" disabled>
    <input type="text">
    <input type="radio">
    <input type="checkbox">
</body>
