<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    div{
        font-size: 30px;
    }
    .content{
        height: 200px;
        width: 200px;
        background-color: aqua;
        padding: 30px;
        border:10px solid;
        box-sizing: content-box;
    }
    .border{
         height: 200px;
        width: 200px;
        background-color: rgb(33, 21, 166);
        padding: 30px;
        border:10px solid;
        box-sizing: border-box;
    }
</style>
<body>
    <div class="content"></div><br>
    <div class="border"></div>
</body>
</html>
